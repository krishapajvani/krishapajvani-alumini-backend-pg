<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast" class="toast"></div>

  <main>
    <h1>Employee Management</h1>

    <section class="card">
      <h2 id="formTitle">Add Employee</h2>
      <form id="empForm" novalidate>
        <div id="fields"></div>
        <div class="actions">
          <button type="submit" id="submitBtn" class="primary">Add Employee</button>
          <button type="button" id="resetBtn" class="secondary">Reset</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="toolbar">
        <h2>All Employees</h2>
        <input type="search" id="search" placeholder="Search by ID, name or email">
        <button id="exportBtn" class="secondary">Download JSON</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Photo</th><th>ID</th><th>Name</th><th>Email</th><th>Mobile</th><th>Department</th><th>Actions</th></tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>

    <section class="card" id="details" hidden></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
